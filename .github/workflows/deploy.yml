name: $bog_trip

permissions: write-all

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    - uses: hyoo-ru/mam_build@master2
      with:
        package: 'bog/trip'

    - name: Audits
      run: |
        set -euo pipefail
        grep -q 'Audit passed' bog/trip/-/web.audit.js
        grep -q 'Audit passed' bog/trip/-/node.audit.js

    - name: Cache-bust the bundle
      run: |
        set -euo pipefail
        sed -i "s|src=\"web.js\"|src=\"web.js?v=${GITHUB_SHA::7}\"|" bog/trip/-/index.html
        grep -q "web.js?v=${GITHUB_SHA::7}" bog/trip/-/index.html

    - uses: hyoo-ru/gh-deploy@v4.4.1
      with:
        folder: 'bog/trip/-'

    - name: URL
      run: |
        set -euo pipefail
        echo "- https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
